plugins {
    id "com.android.application"
}

android {
    namespace "dev.n1cholaspoole.wificonnector"
    compileSdk 34

    defaultConfig {
        applicationId "dev.n1cholaspoole.wificonnector"
        minSdk 21
        // Kept at 28 on purpose: apps targeting 29+ are not allowed to use the
        // legacy WifiManager.addNetwork()/setWifiEnabled() APIs. The app falls
        // back to WifiNetworkSuggestion on devices where the legacy path fails.
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        // targetSdk 28 is intentional: Android 10+ blocks the legacy Wi-Fi APIs
        // for apps targeting 29+, and this app needs them for immediate connection.
        disable "ExpiredTargetSdkVersion"
    }
}

dependencies {
    // No AndroidX / external runtime dependencies. The UI uses platform widgets
    // so the APK stays small and runs on API 21+.
}
